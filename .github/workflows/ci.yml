name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Parte 1 - backend (pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parte1-inventario/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parte1-inventario/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  frontend:
    name: Parte 1 - frontend (tipos y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parte1-inventario/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parte1-inventario/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  rpa:
    name: Parte 2 - RPA (estilo, tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parte2-rpa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: parte2-rpa/requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

  docker:
    name: Docker Compose (construcción de imágenes)
    runs-on: ubuntu-latest
    needs: [backend, frontend, rpa]
    steps:
      - uses: actions/checkout@v4
      - name: Variables de entorno de prueba
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-clave-de-prueba/' .env
          echo "RPA_UID=$(id -u)" >> .env
          echo "RPA_GID=$(id -g)" >> .env
      - run: docker compose build
      - name: Levantar los servicios y esperar a que estén sanos
        run: docker compose up -d --wait db backend frontend antecedentes-mock
      - name: La aplicación responde (API, web y servicio simulado)
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:5173/ > /dev/null
          curl -fsS http://localhost:5173/api/health
          curl -fsS http://localhost:8080/health
      - name: Iniciar sesión en la API con el usuario de prueba
        run: |
          curl -fsS -X POST http://localhost:5173/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@vise.com","password":"Admin123*"}' | grep -q accessToken
      - name: Ejecutar el RPA y verificar el reporte
        run: |
          docker compose run --rm rpa --input /data/cedulas.xlsx --output /data/salida/reporte_ci.xlsx
          test -s parte2-rpa/data/salida/reporte_ci.xlsx
          test -s parte2-rpa/data/salida/rpa_antecedentes.log
      - name: Subir el reporte generado como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rpa
          path: |
            parte2-rpa/data/salida/reporte_ci.xlsx
            parte2-rpa/data/salida/rpa_antecedentes.log
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --no-color
