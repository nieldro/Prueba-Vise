[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-antecedentes"
version = "1.0.0"
description = "RPA de consulta de antecedentes contra un servicio simulado (prueba técnica VISE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
]

[project.scripts]
rpa-antecedentes = "rpa_antecedentes.cli:main"
rpa-antecedentes-mock = "rpa_antecedentes.mock_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["rpa_antecedentes"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "C4", "RET", "PL", "RUF"]
ignore = [
  "PLR2004", # los literales de "magic value" en pruebas y límites HTTP son claros
  "PLR0913", # los constructores reciben opciones nombradas a propósito
  "RUF001",  # caracteres con tilde en textos en español
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
